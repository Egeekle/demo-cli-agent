[project]
name = "demo-cli-agent"
version = "0.1.0"
description = "AI-powered Appointment Assistant CLI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "mlflow[genai]>=3.8.1",
    "openai>=2.15.0",
    "pydantic-ai>=1.47.0",
    "pydantic-settings>=2.12.0",
    "python-dotenv>=1.2.1",
    "sqlmodel>=0.0.31",
    "typer>=0.21.1",
]

[project.scripts]
appointment-agent = "src.main:app"
ml-ui = "src.mlflow_server:serve"

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.0",
]

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
exclude = [
    "tests/evals/safety_confirmation/data/"
]

