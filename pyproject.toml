[project]
name = "demo-cli-agent"
version = "0.1.0"
description = "AI-powered Appointment Assistant CLI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mlflow>=3.8.1",
    "openai>=2.15.0",
    "pydantic-ai>=1.47.0",
    "pydantic-settings>=2.12.0",
    "python-dotenv>=1.2.1",
    "sqlmodel>=0.0.31",
    "typer>=0.21.1",
]

[project.scripts]
appointment-agent = "src.main:app"
ml-ui = "src.mlflow_server:serve"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
